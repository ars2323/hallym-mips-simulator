# The Electron edition (2.x, electron/) on Windows, for real: build, test,
# package, install next to the Qt edition.  Runs when electron/ or CPU/
# changes (the Qt edition's workflow, ci.yml, when anything but electron/
# does); every step works in electron/.
#
#   1. the core builds with MSVC + win_flex/win_bison; tt.core.s words match
#   2. the Node tests on Windows: the simulator process (fork), stop,
#      breakpoints, console input rewind, the modules, the goldens
#   3. the package: the NSIS installer (per user), an artifact only --
#      no tag, no release
#   4. the package is that one file: no zip, nothing else
#   5. side by side with the Qt build 1.2.4 (its release MSI):
#      tools/windows/check-side-by-side.ps1
#   6. the e2e tests against the INSTALLED app (utilityProcess, .err, stop,
#      breakpoints, console input, fonts, settings, About, Korean input
#      through the IME's events); then an attempt with the real Microsoft
#      Korean IME (tools/windows/korean-ime.ps1, tests/e2e/ime-real.e2e.ts)
#   7. tools/probe-platform.ts: simulator handles while running/stepping
#      (the core's waitable timer), screenshots of the native file dialogs;
#      and the fixed set of screens captured on Windows
#   8. (run by hand, and for a v2.* tag) installing over the build the
#      Electron repository last made before the merge (48e645c, the
#      preview build), then this build over itself: one folder, one
#      uninstall entry (tools/windows/check-upgrade.ps1)
name: Electron edition (2.x) — Windows

on:
  push:
    branches: [main]
    tags: ['v2.*']
    paths: ['electron/**', 'CPU/**', '.github/workflows/electron.yml']
  pull_request:
    paths: ['electron/**', 'CPU/**', '.github/workflows/electron.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: electron

jobs:
  windows:
    name: Build, test, package, install
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # no code signing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install winflexbison
        run: choco install winflexbison3 --no-progress -y

      - name: Tool versions
        shell: cmd
        run: |
          node --version
          win_bison --version
          win_flex --version

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: Build the addon (Node)
        run: npx node-gyp rebuild --directory native

      - name: tt.core.s words against the Qt golden
        run: node tests/spike/check-text.js

      - name: Node tests
        run: npm test

      - name: Every document's links and pictures (none broken, none unused)
        run: node tools/check-doc-links.ts

      - name: Build the addon (Electron)
        run: node tools/build-electron.ts

      - name: Package (NSIS installer)
        run: node tools/package.ts

      - name: The package is one file, the installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip', '.msi' })
          $files | ForEach-Object { '{0}  {1:N1} MB  ({2} bytes)' -f $_.Name, ($_.Length / 1MB), $_.Length } |
            Tee-Object -FilePath sizes.txt
          if ($files.Count -ne 1 -or $files[0].Name -notlike 'HallymMIPS-*-win-x64-setup.exe') {
            throw "expected one file, HallymMIPS-<version>-win-x64-setup.exe; got: $($files.Name -join ', ')"
          }
          Write-Host "PASS  one file: $($files[0].Name)"

      - name: The Qt build's 1.2.4 MSI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.2.4 --pattern "*.msi" --dir qt

      - name: Side by side with 1.2.4 (install, both running)
        shell: pwsh
        run: tools/windows/check-side-by-side.ps1 -Phase before -QtMsi (Get-Item qt/*.msi).FullName -Setup (Get-Item dist/*-setup.exe).FullName -Report report

      - name: e2e against the installed app
        timeout-minutes: 15
        shell: pwsh
        run: |
          $env:SPIM_E2E_EXE = (Get-Content report/installed.txt).Trim()
          npx playwright test

      # An attempt, reported either way: the real Microsoft Korean IME
      # (tests/e2e/ime.e2e.ts, in the step above, is the check that counts:
      # the IME's events through CDP).
      - name: Korean IME on the runner (tools/windows/korean-ime.ps1)
        id: koime
        continue-on-error: true
        timeout-minutes: 20
        shell: pwsh
        run: tools/windows/korean-ime.ps1 -Report report

      - name: e2e with the real Korean IME, installed app
        if: steps.koime.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:SPIM_E2E_EXE = (Get-Content report/installed.txt).Trim()
          $env:SPIM_REAL_IME = '1'
          npx playwright test tests/e2e/ime-real.e2e.ts

      - name: Probe (simulator handles, native file dialogs)
        if: always() && hashFiles('electron/report/installed.txt') != ''
        timeout-minutes: 12
        shell: pwsh
        run: |
          $env:SPIM_E2E_EXE = (Get-Content report/installed.txt).Trim()
          node tools/probe-platform.ts report/probe --expect-no-leak

      - name: The fixed set of screens (docs/screens/README.md), captured on Windows
        if: always() && hashFiles('electron/report/installed.txt') != ''
        timeout-minutes: 10
        shell: pwsh
        run: |
          $env:SPIM_E2E_EXE = (Get-Content report/installed.txt).Trim()
          $env:SCREENS_OUT = 'report/screens'
          node tools/capture-screens.ts

      - name: Side by side with 1.2.4 (after; uninstall ours)
        if: always() && hashFiles('electron/report/qt-settings-together.reg') != ''
        shell: pwsh
        run: tools/windows/check-side-by-side.ps1 -Phase after -Report report

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: HallymMIPS-windows
          path: electron/dist/*-setup.exe
          if-no-files-found: error

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-report
          path: |
            electron/sizes.txt
            electron/report/
            electron/test-results/
          if-no-files-found: ignore

      # Diagnosis only: what the generators wrote, when the build fails.
      - name: Generated parser header (on failure)
        if: failure()
        shell: pwsh
        run: |
          $h = Get-ChildItem -Recurse native/build -Filter parser_yacc.h -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($h) {
            Select-String -Path $h.FullName -Pattern '#define yy|yylval|yyparse|api.prefix|YYSTYPE' | ForEach-Object { "$($_.LineNumber): $($_.Line)" }
          }

  # This build over the one students may already have: the Electron
  # repository's last before the merge (48e645c), built here from its commit,
  # since artifacts expire and the old repository's are not this one's to read.
  upgrade:
    name: Install over the pre-merge build (48e645c)
    needs: windows
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v2.')
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install winflexbison
        run: choco install winflexbison3 --no-progress -y

      - name: Build 48e645c
        working-directory: .
        shell: pwsh
        run: |
          git worktree add ../previous 48e645c
          Set-Location ../previous
          npm ci --ignore-scripts
          npx node-gyp rebuild --directory native
          node tools/build-electron.ts
          node tools/package.ts
          Get-ChildItem dist/*-setup.exe | ForEach-Object { $_.FullName }

      - name: This run's 2.0.0
        uses: actions/download-artifact@v4
        with:
          name: HallymMIPS-windows
          path: electron/new

      - name: This build over 48e645c's
        shell: pwsh
        run: |
          $old = (Get-Content ../../previous/package.json | ConvertFrom-Json).version
          $new = (Get-Content package.json | ConvertFrom-Json).version
          tools/windows/check-upgrade.ps1 -Old (Get-Item ../../previous/dist/*-setup.exe).FullName -OldVersion $old `
            -New (Get-Item new/*-setup.exe).FullName -NewVersion $new -Report upgrade

      - name: Upload the upgrade report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-report
          path: electron/upgrade/
          if-no-files-found: ignore
