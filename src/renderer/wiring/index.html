<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>배선 확인</title>
<style>
  @font-face { font-family: Pretendard; src: url(../assets/fonts/Pretendard-Regular.subset.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: Pretendard; src: url(../assets/fonts/Pretendard-SemiBold.subset.woff2) format('woff2'); font-weight: 600; }
  @font-face { font-family: D2Coding; src: url(../assets/fonts/D2Coding.woff2) format('woff2'); }
  body { font: 14px/1.5 Pretendard, sans-serif; font-feature-settings: 'calt' 0; /* Pretendard turns 0x1 into 0×1 */ color: #1f2933; background: #fff; margin: 24px; }
  h1 { font-size: 16px; font-weight: 600; color: #00205b; margin: 0 0 4px; }
  p.note { color: #5a6472; margin: 0 0 16px; }
  table { border-collapse: collapse; font-family: D2Coding, monospace; }
  td { padding: 2px 16px 2px 0; }
  td.v { color: #0055a5; }
  pre { font-family: D2Coding, monospace; background: #f5f7fa; padding: 8px; margin: 8px 0; }
  .ok { color: #00736f; } .bad { color: #c0392b; }
</style>
</head>
<body>
<h1>배선 확인 — UI 가 아닙니다</h1>
<p class="note">창 → 메인 프로세스 → utility process 의 코어 → 다시 창. helloworld.s 를 어셈블하고 실행한 뒤 레지스터를 찍습니다.</p>
<table id="regs"></table>
<pre id="console"></pre>
<div id="log"></div>
<script src="wiring.js"></script>
</body>
</html>
