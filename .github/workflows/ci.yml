# The Qt edition (1.x) of the Hallym MIPS Simulator: continuous integration.
# It does not run for changes under electron/ alone (the Electron edition
# has its own workflow, electron.yml); CPU/ changes run both.
#
# linux:   the development platform.  Builds the release configuration and
#          the CONFIG+=edu_devtools one, runs the unit tests, the regression
#          check against the vanilla-9.1.24 tag, the Korean-path warning
#          check, and captures the panels for review.
# windows: the deployment platform.  Qt 5.15.2 / MSVC 2019 (v142) build,
#          unit tests, and the self-contained zip that students get.
#
# Warnings in our own code fail the linux job; warnings from CPU/ and from
# generated parser/scanner sources are upstream's and are ignored.

name: Qt edition (1.x)

on:
  push:
    branches: [main]
    tags: ['stage-*', 'v1.*']
    paths-ignore: ['electron/**', '.github/workflows/electron.yml']
  pull_request:
    paths-ignore: ['electron/**', '.github/workflows/electron.yml']
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Qt 5.15.3, gcc 11)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # tools/regress.sh needs the vanilla-9.1.24 tag

      - name: Install Qt 5.15 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev qt5-qmake qttools5-dev-tools libqt5help5 bison flex \
            fonts-nanum

      - name: Build (release configuration)
        run: |
          mkdir -p build-release && cd build-release
          qmake ../QtSpim/QtSpim.pro
          make -j"$(nproc)" 2>&1 | tee build.log
          test -x HallymMIPS

      - name: Build (development configuration, CONFIG+=edu_devtools)
        run: |
          mkdir -p build && cd build
          qmake CONFIG+=edu_devtools ../QtSpim/QtSpim.pro
          make -j"$(nproc)" 2>&1 | tee build.log
          test -x HallymMIPS

      - name: No warnings in our code
        run: |
          # Anything not from CPU/ or from bison/flex/moc/uic/rcc output is ours.
          if grep -h 'warning:' build-release/build.log build/build.log \
               | grep -vE '(^|/)CPU/|parser_yacc|scanner_lex|lex\.scanner|moc_|qrc_|ui_' ; then
            echo "::error::compiler warnings in our sources (see above)"
            exit 1
          fi
          echo "no warnings outside CPU/ and generated sources"

      - name: Source tree still clean after building
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Unit tests
        run: |
          mkdir -p build-tests && cd build-tests
          qmake ../tests/tests.pro
          make -j"$(nproc)"
          make check

      - name: Regression against vanilla-9.1.24
        run: tools/regress.sh

      # The real File menu actions (not the command-line route the goldens
      # use), and the same clicks on a vanilla-9.1.24 build for comparison.
      - name: Load through the File menu, compared with vanilla
        run: tools/check-menu-load.sh --compare-vanilla

      - name: Editor (round trips, Assemble, error list)
        run: tools/check-editor.sh

      - name: Korean path warning (end to end)
        run: tools/check-path-warning.sh -o "$RUNNER_TEMP/pathcheck"

      # fonts-nanum above is only so that the Korean text in these is
      # readable when reviewing the artifact.
      - name: Screenshots of every panel
        run: tools/capture-panels.sh -o "$RUNNER_TEMP/screenshots"

      - name: Student guide PDFs
        run: |
          sudo apt-get install -y --no-install-recommends pandoc
          tools/make-guide-pdf.sh "$RUNNER_TEMP/guide"

      - name: Upload guide PDFs
        uses: actions/upload-artifact@v4
        with:
          name: guide-pdf
          path: ${{ runner.temp }}/guide/*.pdf
          if-no-files-found: error

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: linux-screenshots
          path: |
            ${{ runner.temp }}/screenshots/*.png
            ${{ runner.temp }}/pathcheck/shots/*.png
          if-no-files-found: error

  windows:
    name: Windows (Qt 5.15.2, MSVC 2019)
    needs: linux        # the guide PDFs that go into the zip are made there
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 5.15.2 (msvc2019_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: MSVC 2019 toolset (v142) environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.29'

      - name: Install winflexbison
        run: choco install winflexbison3 --no-progress -y

      - name: Tool versions
        shell: cmd
        run: |
          qmake -v
          win_bison --version
          win_flex --version
          cl 2>&1 | findstr /C:"Version"

      - name: Build
        shell: cmd
        run: |
          mkdir build && cd build
          qmake "CONFIG+=release" "CONFIG-=debug_and_release" ..\QtSpim\QtSpim.pro
          if errorlevel 1 exit /b 1
          nmake
          if errorlevel 1 exit /b 1
          dir /s /b HallymMIPS.exe help\HallymMIPS.qch help\HallymMIPS.qhc

      # QT_LOGGING_TO_CONSOLE=1 matters: on Windows QtTest's plain logger
      # sends its report to OutputDebugString instead of stdout unless Qt
      # decides to log to the console (qtbase 5.15,
      # src/testlib/qplaintestlogger.cpp, QPlainTestLogger::outputMessage),
      # so without it the job log shows no PASS/FAIL lines at all.  The
      # output is also checked for a "Totals:" line so that a silent run
      # can never pass again.
      - name: Unit tests
        shell: cmd
        env:
          QT_LOGGING_TO_CONSOLE: '1'
        run: |
          mkdir build-tests && cd build-tests
          qmake "CONFIG+=release" "CONFIG-=debug_and_release" ..\tests\tests.pro
          if errorlevel 1 exit /b 1
          nmake
          if errorlevel 1 exit /b 1
          nmake check > "%RUNNER_TEMP%\unit-tests.log" 2>&1
          set TEST_EXIT=%ERRORLEVEL%
          type "%RUNNER_TEMP%\unit-tests.log"
          findstr /C:"Totals:" "%RUNNER_TEMP%\unit-tests.log" >nul || (echo no QtTest report in the output & exit /b 1)
          if not "%TEST_EXIT%"=="0" exit /b %TEST_EXIT%

      - name: Guide PDFs from the Linux job
        uses: actions/download-artifact@v4
        with:
          name: guide-pdf
          path: guide-pdf

      - name: Package zip
        shell: pwsh
        run: tools/package-windows.ps1 -BuildDir build -OutDir dist -GuideDir guide-pdf

      # The zip as a student gets it: unpack it somewhere else and start the
      # program.  A packaged Qt program that is missing a DLL or the
      # platform plugin dies at once with a box, so a process that is still
      # alive after a few seconds is the thing worth checking here.
      - name: The packaged program starts
        shell: pwsh
        run: |
          $zip = (Get-Item dist/*.zip).FullName
          $out = Join-Path $env:RUNNER_TEMP "smoke"
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip -DestinationPath $out
          $exe = Join-Path $out "HallymMIPS.exe"
          if (-not (Test-Path $exe)) { throw "no HallymMIPS.exe at the root of the zip" }
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            throw "the program exited by itself with code $($p.ExitCode)"
          }
          Write-Host "PASS  the unpacked program was still running after 10 seconds"
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 2
          Write-Host "PASS  and stopped cleanly"

      - name: Package MSI (WiX)
        shell: pwsh
        run: tools/package-msi.ps1 -OutDir dist

      # The MSI of the release before this one, so that the check can put the
      # new one in over it.  A release that Windows refuses to install over
      # the last one would leave students on the version they have.
      - name: Fetch the previous release's MSI
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path previous | Out-Null
          $tag = (gh release list --limit 20 --json tagName,isDraft |
                  ConvertFrom-Json |
                  Where-Object { -not $_.isDraft -and $_.tagName -match '^v1\.' } |
                  Select-Object -First 1).tagName
          if ($tag) {
            Write-Host "previous release: $tag"
            gh release download $tag --pattern "*.msi" --dir previous
          }

      # Tables, then a real silent install and uninstall next to a stand-in
      # for a standard QtSpim installation -- and, when the previous
      # release was fetched, an upgrade over it.
      - name: MSI does not collide with standard QtSpim
        shell: pwsh
        run: |
          $previous = (Get-ChildItem previous/*.msi -ErrorAction SilentlyContinue |
                       Select-Object -First 1)
          if ($previous) {
            tools/check-msi.ps1 -Msi (Get-Item dist/*.msi).FullName `
              -Previous $previous.FullName -Install
          } else {
            Write-Host "no previous release MSI: the upgrade is not checked"
            tools/check-msi.ps1 -Msi (Get-Item dist/*.msi).FullName -Install
          }

      - name: Upload zip and MSI
        uses: actions/upload-artifact@v4
        with:
          name: HallymMIPS-windows
          path: |
            dist/*.zip
            dist/*.msi
          if-no-files-found: error
