# The Electron edition (2.x, electron/) on Windows, for real: build, test,
# package, install next to the Qt edition.  Runs when electron/ or CPU/
# changes (the Qt edition's workflow, ci.yml, when anything but electron/
# does); every step works in electron/.
#
#   0. the screen set to 1920x1080, the students' (tools/windows/screen-1920.ps1)
#   1. the core builds with MSVC + win_flex/win_bison; tt.core.s words match
#   2. the Node tests on Windows: the simulator process (fork), stop,
#      breakpoints, console input rewind, the modules, the goldens
#   3. the package: the NSIS installer (per user), an artifact only --
#      no tag, no release
#   4. the package is that one file: no zip, nothing else
#   5. side by side with the Qt build 1.2.4 (its release MSI):
#      tools/windows/check-side-by-side.ps1
#   6. the e2e tests against the INSTALLED app (utilityProcess, .err, stop,
#      breakpoints, console input, fonts, settings, About, Korean input
#      through the IME's events); then an attempt with the real Microsoft
#      Korean IME (tools/windows/korean-ime.ps1, tests/e2e/ime-real.e2e.ts)
#   7. tools/probe-platform.ts: simulator handles while running/stepping
#      (the core's waitable timer), screenshots of the native file dialogs;
#      and the fixed set of screens captured on Windows
#   8. (run by hand, and for a v2.* tag) installing over the latest
#      published 2.x release (its installer downloaded from its release
#      page; not run, with a notice, while this build has the released
#      version) and over the build the Electron repository last made before
#      the merge (48e645c, the preview build), each time then this build over
#      itself: one folder, one uninstall entry (tools/windows/check-upgrade.ps1)
#   9. (a v2.* tag only) the release: published from this run's installer,
#      with the notes the tagged commit carries (electron/docs/releases/
#      <version>.md) and the installer's SHA-256, not a pre-release, Latest;
#      then checked as a student gets it (release-check.yml: downloaded from
#      the public address, hash, install, every e2e, links, Latest, the
#      earlier releases still there).  A failure anywhere on a tag opens an
#      issue.
name: Electron edition (2.x) — Windows

on:
  push:
    branches: [main]
    tags: ['v2.*']
    paths: ['electron/**', 'CPU/**', '.github/workflows/electron.yml']
  pull_request:
    paths: ['electron/**', 'CPU/**', '.github/workflows/electron.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: electron

jobs:
  windows:
    name: Build, test, package, install
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # no code signing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install winflexbison
        run: choco install winflexbison3 --no-progress -y

      # The screen the students have and the default layout is made for:
      # 1920x1080 (the runner starts at 1024x768).  Everything after it --
      # the e2e against the installed app, the screens -- runs on it.
      # Reported either way (report/screen.txt); the e2e do not depend on it.
      - name: Screen 1920x1080 (tools/windows/screen-1920.ps1)
        continue-on-error: true
        shell: powershell
        run: tools/windows/screen-1920.ps1 -Report report

      - name: Tool versions
        shell: cmd
        run: |
          node --version
          win_bison --version
          win_flex --version

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: Build the addon (Node)
        run: npx node-gyp rebuild --directory native

      - name: tt.core.s words against the Qt golden
        run: node tests/spike/check-text.js

      - name: Node tests
        run: npm test

      - name: Every document's links and pictures (none broken, none unused)
        run: node tools/check-doc-links.ts

      - name: Build the addon (Electron)
        run: node tools/build-electron.ts

      - name: Package (NSIS installer)
        run: node tools/package.ts

      - name: The package is one file, the installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip', '.msi' })
          $files | ForEach-Object { '{0}  {1:N1} MB  ({2} bytes)' -f $_.Name, ($_.Length / 1MB), $_.Length } |
            Tee-Object -FilePath sizes.txt
          if ($files.Count -ne 1 -or $files[0].Name -notlike 'HallymMIPS-*-win-x64-setup.exe') {
            throw "expected one file, HallymMIPS-<version>-win-x64-setup.exe; got: $($files.Name -join ', ')"
          }
          Write-Host "PASS  one file: $($files[0].Name)"

      - name: The Qt build's 1.2.4 MSI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.2.4 --pattern "*.msi" --dir qt

      - name: Side by side with 1.2.4 (install, both running)
        shell: pwsh
        run: tools/windows/check-side-by-side.ps1 -Phase before -QtMsi (Get-Item qt/*.msi).FullName -Setup (Get-Item dist/*-setup.exe).FullName -Report report

      - name: e2e against the installed app
        timeout-minutes: 15
        shell: pwsh
        run: |
          $env:SPIM_E2E_EXE = (Get-Content report/installed.txt).Trim()
          npx playwright test

      # An attempt, reported either way: the real Microsoft Korean IME
      # (tests/e2e/ime.e2e.ts, in the step above, is the check that counts:
      # the IME's events through CDP).
      - name: Korean IME on the runner (tools/windows/korean-ime.ps1)
        id: koime
        continue-on-error: true
        timeout-minutes: 20
        shell: pwsh
        run: tools/windows/korean-ime.ps1 -Report report

      - name: e2e with the real Korean IME, installed app
        if: steps.koime.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:SPIM_E2E_EXE = (Get-Content report/installed.txt).Trim()
          $env:SPIM_REAL_IME = '1'
          npx playwright test tests/e2e/ime-real.e2e.ts

      - name: Probe (simulator handles, native file dialogs)
        if: always() && hashFiles('electron/report/installed.txt') != ''
        timeout-minutes: 12
        shell: pwsh
        run: |
          $env:SPIM_E2E_EXE = (Get-Content report/installed.txt).Trim()
          node tools/probe-platform.ts report/probe --expect-no-leak

      - name: The fixed set of screens (docs/screens/README.md), captured on Windows
        if: always() && hashFiles('electron/report/installed.txt') != ''
        timeout-minutes: 10
        shell: pwsh
        run: |
          $env:SPIM_E2E_EXE = (Get-Content report/installed.txt).Trim()
          $env:SCREENS_OUT = 'report/screens'
          node tools/capture-screens.ts

      - name: Side by side with 1.2.4 (after; uninstall ours)
        if: always() && hashFiles('electron/report/qt-settings-together.reg') != ''
        shell: pwsh
        run: tools/windows/check-side-by-side.ps1 -Phase after -Report report

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: HallymMIPS-windows
          path: electron/dist/*-setup.exe
          if-no-files-found: error

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-report
          path: |
            electron/sizes.txt
            electron/report/
            electron/test-results/
          if-no-files-found: ignore

      # Diagnosis only: what the generators wrote, when the build fails.
      - name: Generated parser header (on failure)
        if: failure()
        shell: pwsh
        run: |
          $h = Get-ChildItem -Recurse native/build -Filter parser_yacc.h -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($h) {
            Select-String -Path $h.FullName -Pattern '#define yy|yylval|yyparse|api.prefix|YYSTYPE' | ForEach-Object { "$($_.LineNumber): $($_.Line)" }
          }

  # This build over the ones students may already have: the latest published
  # 2.x release, downloaded from its release page; and the Electron
  # repository's last build before the merge (48e645c), built here from its
  # commit, since artifacts expire and the old repository's are not this
  # one's to read.
  upgrade:
    name: Install over the latest 2.x release and the pre-merge build
    needs: windows
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v2.')
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install winflexbison
        run: choco install winflexbison3 --no-progress -y

      - name: Build 48e645c
        working-directory: .
        shell: pwsh
        run: |
          git worktree add ../previous 48e645c
          Set-Location ../previous
          npm ci --ignore-scripts
          npx node-gyp rebuild --directory native
          node tools/build-electron.ts
          node tools/package.ts
          Get-ChildItem dist/*-setup.exe | ForEach-Object { $_.FullName }

      - name: This run's installer
        uses: actions/download-artifact@v4
        with:
          name: HallymMIPS-windows
          path: electron/new

      - name: The latest published 2.x release's installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Published, not a pre-release, not this run's own tag: the newest such 2.x release.
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --exclude-drafts --exclude-pre-releases --limit 100 --json tagName,publishedAt | ConvertFrom-Json
          $tag = ($releases | Where-Object { $_.tagName -like 'v2.*' -and $_.tagName -ne $env:GITHUB_REF_NAME } |
            Sort-Object { [datetime]$_.publishedAt } -Descending | Select-Object -First 1).tagName
          if (-not $tag) { throw 'no published 2.x release to install over' }
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern '*-setup.exe' --dir released
          "$tag" | Set-Content released/tag.txt
          Get-ChildItem released | ForEach-Object { $_.Name }

      - name: This build over the latest 2.x release
        shell: pwsh
        run: |
          $old = (Get-Content released/tag.txt).Trim().TrimStart('v')
          $new = (Get-Content package.json | ConvertFrom-Json).version
          # Between releases main carries the released version (it is raised
          # only in the commit that is released): nothing to upgrade from, and
          # installing 2.1.0 over 2.1.0 is not a student's case.  On a tag it
          # is a mistake.
          if ($new -eq $old) {
            if ($env:GITHUB_REF_TYPE -eq 'tag') { throw "this build is $new, the version of the latest release: raise the version in the release commit" }
            New-Item -ItemType Directory -Force upgrade/release | Out-Null
            "not run: this build is $new, the version of the latest release (v$old)" | Set-Content upgrade/release/upgrade.txt
            Write-Host "::notice title=Upgrade over v$old not run::This build is $new, the version of the latest release. The check runs on the release commit, where the version is raised."
            exit 0
          }
          tools/windows/check-upgrade.ps1 -Old (Get-Item released/*-setup.exe).FullName -OldVersion $old `
            -New (Get-Item new/*-setup.exe).FullName -NewVersion $new -Report upgrade/release

      - name: This build over 48e645c's
        shell: pwsh
        run: |
          $old = (Get-Content ../../previous/package.json | ConvertFrom-Json).version
          $new = (Get-Content package.json | ConvertFrom-Json).version
          tools/windows/check-upgrade.ps1 -Old (Get-Item ../../previous/dist/*-setup.exe).FullName -OldVersion $old `
            -New (Get-Item new/*-setup.exe).FullName -NewVersion $new -Report upgrade/preview

      - name: Upload the upgrade report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-report
          path: electron/upgrade/
          if-no-files-found: ignore

  # A v2.* tag: the release.  Published from this run's installer (the one
  # the e2e ran against), with the notes the tagged commit carries and the
  # installer's SHA-256; not a pre-release; Latest.  Only after the build,
  # the tests and the upgrades have passed.
  publish:
    name: Publish the release
    needs: [windows, upgrade]
    if: startsWith(github.ref, 'refs/tags/v2.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: This run's installer
        uses: actions/download-artifact@v4
        with:
          name: HallymMIPS-windows
          path: dist

      - name: The version, the notes, the installer, its SHA-256
        run: |
          version="${GITHUB_REF_NAME#v}"
          package=$(node -p "require('./electron/package.json').version")
          [ "$package" = "$version" ] || { echo "::error::the tag is $GITHUB_REF_NAME but electron/package.json says $package"; exit 1; }
          notes="electron/docs/releases/$version.md"
          [ -f "$notes" ] || { echo "::error::no release notes for $version: $notes"; exit 1; }
          setup="dist/HallymMIPS-$version-win-x64-setup.exe"
          [ -f "$setup" ] || { echo "::error::no $setup"; exit 1; }
          [ "$(ls dist | wc -l)" = 1 ] || { echo "::error::the package is not one file: $(ls dist)"; exit 1; }
          hash=$(sha256sum "$setup" | cut -d' ' -f1)
          {
            cat "$notes"
            printf '\n## SHA-256\n\nBuilt by CI from the tag `%s` (commit %s). To check the download on Windows: `certutil -hashfile <file> SHA256`.\n\n```\n%s  %s\n```\n' \
              "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" "$hash" "$(basename "$setup")"
          } > release-notes.md
          echo "SETUP=$setup" >> "$GITHUB_ENV"
          echo "$hash  $(basename "$setup")"

      - name: Publish (not a pre-release; Latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$SETUP" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Hallym MIPS ${GITHUB_REF_NAME#v}" --notes-file release-notes.md --latest
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,assets \
            --jq '"\(.url)  draft=\(.isDraft) prerelease=\(.isPrerelease)  " + ([.assets[].name] | join(", "))'

  # Then the release as a student gets it (release-check.yml).
  release-check:
    name: The published release, as downloaded
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v2.')
    uses: ./.github/workflows/release-check.yml
    with:
      tag: ${{ github.ref_name }}

  # A tag whose build, tests, upgrade, publishing or post-release check
  # failed: an issue says so, so that it cannot go unnoticed.
  release-failed:
    name: Report a failed release
    needs: [windows, upgrade, publish, release-check]
    if: failure() && startsWith(github.ref, 'refs/tags/v2.')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Release $GITHUB_REF_NAME failed" --body "The workflow for the tag \`$GITHUB_REF_NAME\` failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Build / tests: ${{ needs.windows.result }}; upgrade: ${{ needs.upgrade.result }}; publish: ${{ needs.publish.result }}; post-release check: ${{ needs.release-check.result }}.

          If the release was published and its check failed, see electron/docs/WINDOWS.md, \"Rolling back a release\"."

