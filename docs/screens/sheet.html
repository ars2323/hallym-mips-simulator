<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- Rendered to sheet.png by tools/capture-screens.ts -->
<link rel="stylesheet" href="../../src/renderer/app/app.css">
<style>
  html, body { overflow: visible; height: auto; background: #fff; }
  body { padding: 24px 28px; }
  h1 { font-size: 22px; color: var(--navy); margin: 0 0 4px; }
  p { color: var(--text-2); margin: 0 0 14px; }
  table { border-collapse: separate; border-spacing: 8px 8px; }
  th { font: 600 13px var(--ui); color: var(--navy); text-align: left; }
  th span { font-weight: 400; color: var(--text-2); }
  td.scene { font: 600 14px var(--ui); color: var(--navy); vertical-align: middle; white-space: nowrap; }
  td.scene span { display: block; font-weight: 400; font-size: 12px; color: var(--text-2); }
  td.first { padding-left: 14px; border-left: 3px solid var(--blue-tint2); }
  img { height: 240px; border: 1px solid var(--border); border-radius: 4px; display: block; }
  .tag { font: 600 11px var(--ui); color: var(--muted); margin-bottom: 2px; }
</style>
</head>
<body>
<h1>시안(방향 1)과 실제 앱</h1>
<p>같은 내용: lab04.s(15행 오류) · lab04-ok.s 16단계 · <span class="mono">sra $s1, $t6, 1</span>(<span class="mono">0x00400054</span>) 고름. 크기마다 왼쪽이 시안, 오른쪽이 앱.</p>
<table id="t"></table>
<script>
  const scenes = [['A', '첫 화면'], ['B', '코드 (오류)'], ['C', '한 줄씩 실행'], ['D', 'Inspector']];
  const sizes = ['1920x1080', '1280x800', '960x1080'];
  let html = '<tr><th></th>' + sizes.map((s) => `<th colspan="2" class="first">${s.replace('x', '×')} <span>시안 · 앱</span></th>`).join('') + '</tr>';
  for (const [s, name] of scenes) {
    html += `<tr><td class="scene">${s}<span>${name}</span></td>` + sizes.map((z) =>
      `<td class="first"><div class="tag">시안</div><img src="../mockups/${s}-1-${z}.png"></td><td><div class="tag">앱</div><img src="${s}-${z}.png"></td>`).join('') + '</tr>';
  }
  document.getElementById('t').innerHTML = html;
</script>
</body>
</html>
